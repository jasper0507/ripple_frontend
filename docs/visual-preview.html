帖</h1><div class="detail-byline"><div><span class="detail-author">alice01</span><time datetime="2026-10-05T11:50:12.973Z" class="detail-time">2026年10月5日 19:50</time></div><button data-slot="button" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg text-sm leading-5 transition-colors duration-150 disabled:cursor-not-allowed disabled:bg-hover disabled:text-muted disabled:border-line [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 [&amp;_svg]:shrink-0 text-muted hover:bg-hover py-3 px-2.5 font-normal hover:text-danger" type="button">删除帖子</button></div></header><div class="detail-content"><div class="post-body"><p>我们正在调整论坛的阅读体验，想听听大家的使用习惯。</p>
<p>浏览帖子时，你更关注话题标题、发布时间，还是社区分类？我倾向于让标题先进入视线，作者和时间作为辅助信息。</p>
<h2>关于投票</h2>
<p>赞成和反对应该分别显示，避免把净票数误认为赞成票数。你的选择仍可以取消。</p>
<blockquote>
<p>让讨论内容成为页面的中心。</p>
</blockquote>
<p>下面是一段接口调用示例：</p>
<pre><code class="language-ts">const response = await fetch(`/api/v1/posts/${postId}`)

const destinations={'/':'home','/communities/1':'community','/posts/1':'post','/posts/new':'new','/login':'login','/register':'register'};
function show(id){const t=document.getElementById('view-'+id);if(!t)return;stage.replaceChildren(t.content.cloneNode(true));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===id?'page':'false'));}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
stage.addEventListener('submit',e=>e.preventDefault());
stage.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&!a.getAttribute('href').startsWith('#')){e.preventDefault();const path=a.getAttribute('href').split('?')[0];show(destinations[path]||(path.startsWith('/communities/')?'community':path.startsWith('/posts/')?'post':'missing'));}});
